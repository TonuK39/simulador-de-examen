<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Examen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna centrada tipo "hoja de examen"; tarjetas solo donde separan objetos reales. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --fg:#16201C; --muted:#5B6964; --line:#D8E0DC;
  --accent:#1C6A56; --accent-ink:#FFFFFF; --accent-soft:#E2EEE9;
  --good:#1E7A47; --good-soft:#E3F3E9; --bad:#B0362D; --bad-soft:#F9E6E3; --warn:#9A6A12; --warn-soft:#FBF1DC;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --fg:#E4EBE8; --muted:#94A49E; --line:#2A3632;
  --accent:#5BC3A0; --accent-ink:#0C1512; --accent-soft:#1B2F28;
  --good:#5CC98C; --good-soft:#15291E; --bad:#F07C70; --bad-soft:#2E1A18; --warn:#E0B456; --warn-soft:#2C2412;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --fg:#E4EBE8; --muted:#94A49E; --line:#2A3632;
  --accent:#5BC3A0; --accent-ink:#0C1512; --accent-soft:#1B2F28;
  --good:#5CC98C; --good-soft:#15291E; --bad:#F07C70; --bad-soft:#2E1A18; --warn:#E0B456; --warn-soft:#2C2412;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:600;font-size:19px;margin-right:auto;background:none;border:0;padding:0;cursor:pointer}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;padding:6px 10px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
.nav button:hover{color:var(--fg);background:var(--accent-soft)}
.nav button.on{color:var(--accent);font-weight:600}

.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(32px,6.5vw,46px);line-height:1.08;margin:6px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h1 small{display:block;font-size:.55em;font-weight:500;color:var(--accent);margin-top:6px}
h2{font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .num{font-variant-numeric:tabular-nums}
.hero{padding-block:30px 18px;display:flex;flex-direction:column;gap:6px}
.hero p{color:var(--muted);max-width:62ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 18px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:46px;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* formulario */
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:400;min-width:0}
textarea{resize:vertical;min-height:110px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--bg);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.files{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.file{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.file b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* elegir método */
.ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.ways{grid-template-columns:1fr}}
.way{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.way:hover{border-color:var(--accent);transform:translateY(-1px)}
.way .n{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.way b{font-size:17px}
.way .d{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.g{border-color:var(--good);color:var(--good)} .chip.w{border-color:var(--warn);color:var(--warn)} .chip.b{border-color:var(--bad);color:var(--bad)}

/* bancos */
.banks{display:flex;flex-direction:column;gap:12px}
.bank{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bank .t{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.bank .t b{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.2}

/* pasos */
.steps{display:flex;flex-direction:column;gap:14px;counter-reset:st}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.step::before{counter-increment:st;content:counter(st);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.step>div{min-width:0;display:flex;flex-direction:column;gap:8px}
.note{border-radius:10px;padding:12px 14px;font-size:14.5px;border:1px solid var(--line);background:var(--bg)}
.note.w{background:var(--warn-soft);border-color:var(--warn)}
.note.g{background:var(--good-soft);border-color:var(--good)}
.note.b{background:var(--bad-soft);border-color:var(--bad)}
.note ul{margin:6px 0 0;padding-left:20px} .note li{margin:2px 0}
.code{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
.progress{display:flex;flex-direction:column;gap:8px}

/* temas */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.chk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg);min-width:0}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none}
.chk span{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.chk b{font-size:14.5px;overflow-wrap:anywhere} .chk em{font-style:normal;font-size:12px;color:var(--muted)}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.mode .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mode .n{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1}
.mode .d{font-size:13px;color:var(--muted)}
.mode.alt{flex-direction:row;align-items:center;gap:14px}
.mode.alt .t{display:flex;flex-direction:column;min-width:0}
.badge{margin-left:auto;font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:99px;background:var(--bad-soft);color:var(--bad);flex:none}

/* reactivo */
.qhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qcount{font-family:var(--f-mono);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qtext{font-family:var(--f-display);font-size:clamp(20px,3.6vw,24px);line-height:1.35;font-weight:500;text-wrap:pretty;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;font-size:16px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;border:1.5px solid var(--line);color:var(--muted)}
.opt span:last-child{min-width:0;padding-top:2px}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .l{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .l{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.mk{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;vertical-align:1px}
.mk.ok{background:var(--good);color:var(--surface)} .mk.no{background:var(--bad);color:var(--surface)}
.fb{border-radius:10px;padding:14px 16px;border:1px solid;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft);border-color:var(--good)} .fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{font-size:17px} .fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.src{font-size:13px;color:var(--muted)}
.lives{display:inline-flex;gap:4px;align-items:center;margin-left:auto}
.heart{width:22px;height:22px;transition:transform .25s}
.heart.on{fill:var(--bad)} .heart.off{fill:var(--line);transform:scale(.85)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* resultados */
.score{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:600;font-size:clamp(64px,14vw,92px);line-height:.9;letter-spacing:-.02em}
.big small{font-size:.36em;color:var(--muted);font-weight:500}
.verdict{display:inline-block;font-weight:700;padding:5px 12px;border-radius:99px;font-size:14px}
.v-ex{background:var(--good-soft);color:var(--good)} .v-mb{background:var(--accent-soft);color:var(--accent)} .v-b{background:var(--warn-soft);color:var(--warn)} .v-r{background:var(--bad-soft);color:var(--bad)}
.counts{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.tbars{display:flex;flex-direction:column;gap:12px}
.tb{display:grid;grid-template-columns:minmax(0,180px) 1fr 52px;gap:12px;align-items:center;font-size:14px}
.tb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .bar{margin:0} .tb .pct{text-align:right;font-family:var(--f-mono)}
.miss{display:flex;flex-direction:column;gap:12px}
.mi{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.mi .q{font-weight:600;white-space:pre-line}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14.5px;margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv .bad{color:var(--bad)} .kv .good{color:var(--good);font-weight:600}
.exp{font-size:14.5px;background:var(--bg);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
.over{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:12px 16px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.focus{border-left:4px solid var(--bad);background:var(--surface);border-radius:var(--r);padding:16px 18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hist td.r{text-align:right}
.scroll{overflow-x:auto}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}

/* revisión */
.rq{display:flex;flex-direction:column;gap:8px}
.rq.off{opacity:.5}
.rq .q{font-weight:600;white-space:pre-line}
.ans{display:flex;flex-direction:column;gap:3px;font-size:14.5px;margin:0;padding:0;list-style:none}
.ans li{padding-left:22px;position:relative;overflow-wrap:anywhere}
.ans li::before{position:absolute;left:0;top:0;font-weight:700}
.ans li.c{color:var(--good);font-weight:600} .ans li.c::before{content:"✓"}
.ans li.x{color:var(--muted)} .ans li.x::before{content:"✗";color:var(--bad)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.filters button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="brand" type="button" data-go="home">Simulador de Examen</button>
  <nav class="nav" aria-label="Secciones">
    <button type="button" data-go="home">Mis bancos</button>
    <button type="button" data-go="create">Crear banco</button>
    <button type="button" data-go="settings">Configuración</button>
    <button type="button" data-go="help">Ayuda</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ==== GENERADOR SIN IA (algoritmo) ====
   Entrada: páginas con fragmentos de texto {str,x,top,w,h}.
   Salida: preguntas en el formato del banco. */
const ALGO = (() => {
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ñ]+/g," ").trim();
  const clean = s => s.replace(/\s+/g," ").replace(/\s([,.;:)])/g,"$1").replace(/\(\s/g,"(").trim();

  function linesOf(items){
    const its = items.filter(i=>i.str.trim()).map(i=>({...i, x1:i.x+i.w})).sort((a,b)=>a.top-b.top||a.x-b.x);
    const lines=[];
    for(const w of its){
      let target=null;
      for(const L of lines){
        if(Math.abs(L.top-w.top)<Math.max(2,w.h*.35) && Math.abs(L.h-w.h)<Math.max(.6,w.h*.08) && (w.x-L.x1 < w.h*0.9 || (w.x-L.x1 < Math.min(w.h*1.9,60) && /^[a-záéíóúñ0-9,.;:)(%$]/.test(w.str.trim()))) && w.x-L.x1 > -w.h*.5){ target=L; break; }
      }
      if(target){ target.text += (w.x-target.x1 > w.h*.12 && !/^\s/.test(w.str) && !/\s$/.test(target.text) ? " " : "") + w.str; target.x1=Math.max(target.x1,w.x1); }
      else lines.push({text:w.str, top:w.top, bottom:w.top+w.h, x:w.x, x1:w.x1, h:w.h});
    }
    lines.forEach(l=>l.text=clean(l.text));
    return lines.filter(l=>l.text);
  }

  function blocksOf(lines){
    lines=[...lines].sort((a,b)=>a.top-b.top||a.x-b.x);
    const blocks=[];
    for(const l of lines){
      let best=null;
      for(const b of blocks){
        const last=b.lines[b.lines.length-1];
        const same=Math.abs(last.h-l.h)<Math.max(.6,l.h*.08);
        const gap=l.top-last.bottom;
        const close=gap>=-1 && gap<l.h*1.1;
        const overlap=Math.min(b.x1,l.x1)-Math.max(b.x,l.x)>0;
        if(same&&close&&overlap&&!/:$/.test(last.text)) best=b;
      }
      if(best){best.lines.push(l);best.x=Math.min(best.x,l.x);best.x1=Math.max(best.x1,l.x1);best.bottom=l.bottom;}
      else blocks.push({lines:[l],x:l.x,x1:l.x1,top:l.top,bottom:l.bottom,h:l.h});
    }
    blocks.forEach(b=>b.text=clean(b.lines.map(l=>l.text).join(" ")));
    return blocks;
  }

  const GENERIC=/^(introducci[oó]n|conclusi[oó]n(es)?|gracias|muchas gracias|thank|thanks|índice|indice|agenda|objetivos?|tema \d+|m[oó]dulo|bibliograf|referencias|fuente|preguntas|¡?muchas)/i;

  function isAcronym(s){ return /^\(?[A-ZÁÉÍÓÚÑ]{2,7}\)?$/.test(s.trim()); }
  function initialsMatch(sig, phrase){
    sig=sig.replace(/[()]/g,"").toUpperCase();
    const caps=phrase.split(/\s+/).filter(w=>/^[A-ZÁÉÍÓÚÑ]/.test(w)).map(w=>w[0].normalize("NFD")[0].toUpperCase()).join("");
    let i=0; for(const c of caps){ if(c===sig[i]) i++; if(i===sig.length) return true; }
    return false;
  }

  function listItems(lines){
    const items=[];
    for(const t0 of lines){ const t=t0.replace(/^(?:[•·▪◦\-–]|\d{1,2}[.)](?=\s))\s*/,""); if(!t) continue;
      if(items.length && (/^[a-záéíóúñ(]/.test(t) || /,$/.test(items[items.length-1]) || /\b(de|del|la|el|y|o|en|con|por|para|a)$/i.test(items[items.length-1]))) items[items.length-1]+=" "+t; else items.push(t); }

      const allBlocks=doc.pages.map(p=>({page:p.page, blocks:blocksOf(linesOf(p.items))}));
      const sizes=[]; allBlocks.forEach(pb=>pb.blocks.forEach(b=>{ for(let k=0;k<Math.min(b.text.length,400);k+=10) sizes.push(b.h); }));
      sizes.sort((a,b)=>a-b); const body=sizes.length?sizes[Math.floor(sizes.length/2)]:12;
      for(const pb of allBlocks){
        const bs=pb.blocks;
        const ps=[]; bs.forEach(b=>{ for(let k=0;k<Math.min(b.text.length,400);k+=10) ps.push(b.h); }); ps.sort((a,b)=>a-b);
        const pageBody=ps.length?ps[Math.floor(ps.length/2)]:body, ref=Math.min(body,pageBody);

        const ov=(a,b,pad=0)=>Math.min(a.x1,b.x1+pad)-Math.max(a.x,b.x-pad)>0;
        // un título no continúa en un párrafo del mismo tamaño justo debajo (eso sería una línea de texto justificado)

        const isHead=b=> isAcronym(b.text) || (b.h>=ref*1.12 && b.text.split(" ").length<=8 && b.text.length>=3 && !/^\d+$/.test(b.text) && !isPara(b));
        const heads=bs.filter(isHead);
        for(const h of heads){
          let term=h.text.replace(/[:.]$/,"");
          const qm=term.match(/^¿\s*qu[eé]\s+(?:es|son)\s+(?:un|una|el|la|los|las)?\s*(.+?)\?$/i);
          if(qm) term=qm[1];
          term=term.charAt(0).toUpperCase()+term.slice(1);
          if(GENERIC.test(term)) continue;
          if(term===term.toUpperCase() && !isAcronym(term)) continue;
          if(pb.page===1 && doc.pages.length>3) continue;
          if(term.split(" ").length>=4 && /\s(es|son|pueden|puede|debe|deben|tienen|tiene|se)\s/i.test(" "+term+" ")) continue;
          const acr=isAcronym(term);
          const below=b=>b!==h && !/^[\d\s.)-]*$/.test(b.text) && b.text.length>=3 && (acr||!heads.includes(b)) && b.top>=h.bottom-2 && Math.min(b.x1,h.x1+60)-Math.max(b.x,h.x-60)>0;
          // el título más cercano por encima del bloque debe ser este (evita que el título de la diapositiva "robe" la primera columna)
          const ownHead=b=>{const ab=heads.filter(o=>o.bottom<=b.top+2 && Math.min(b.x1,o.x1+60)-Math.max(b.x,o.x-60)>0); return ab.length && ab.reduce((m,o)=>(b.top-o.bottom)<(b.top-m.bottom)?o:m)===h;};
          const cands=bs.filter(b=>below(b)&&ownHead(b));
          if(!cands.length) continue;
          cands.sort((a,b)=>a.top-b.top);
          const c=cands[0];
          if(c.top-h.bottom>Math.max(h.h*8,380)) continue;

          const second=cands[1];
          if(second && !acr){ const it2=listItems(second.lines.map(l=>l.text)); if(looksList(it2)) out.push({kind:"lista",term:term,items:it2,page:pb.page,doc:doc.name,ejemplos:true}); }
          const words=c.text.split(" ").length;
          if(isAcronym(term) && initialsMatch(term,c.text)){ out.push({kind:"sigla",term:term.replace(/[()]/g,""),def:c.text.replace(/\.$/,""),page:pb.page,doc:doc.name}); continue; }
          if(isAcronym(c.text)) continue;
          // ¿lista? varias líneas cortas que no son la continuación de una oración
          const it=listItems(c.lines.map(l=>l.text));
          if(c.lines.length>=3 && looksList(it)){ out.push({kind:"lista",term,items:it,page:pb.page,doc:doc.name}); continue; }
          if(words<4 || /:$/.test(c.text)) continue;
          if(/m[oó]dulo\s*\d|tema\s*\d/i.test(c.text) && words<8) continue;
          const letters=c.text.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g,""); if(letters && letters.replace(/[^A-ZÁÉÍÓÚÑ]/g,"").length/letters.length>.6) continue;
          out.push({kind:"def",term,def:c.text,page:pb.page,doc:doc.name});
        }

        for(const b of bs){
          for(const m of b.text.matchAll(/((?:[A-ZÁÉÍÓÚ][\wáéíóúñ]+\s(?:de\s|del\s|la\s|en\s|y\s)*){2,8})\(([A-ZÁÉÍÓÚÑ]{2,7})\)/g)){
            if(initialsMatch(m[2],m[1])) out.push({kind:"sigla",term:m[2],def:m[1].trim(),page:pb.page,doc:doc.name});
          }
        }

    }

    return [...byDef.values()].filter(c=>{const k=c.kind+norm(c.term); if(seen.has(k))return false; seen.add(k); return true;});
  }

  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

      const similar=shuffle(ok.filter(o=>norm(o.term).split(" ")[0]===first)), rest=shuffle(ok.filter(o=>norm(o.term).split(" ")[0]!==first));

      return same.slice(0,n);
    };
    for(const c of defs){
      const d=pickTerms(c,defs,3);
      if(d.length<3) continue;
      const short=firstSentences(c.def);
      qs.push({tema:temaOf(c),dificultad:2,tipo:"definicion",concepto:c.term,
        pregunta:`¿A qué concepto corresponde esta descripción?\n«${mask(short,c.term)}»`,
        correcta:c.term,incorrectas:d.map(o=>o.term),
        explicacion:`Según el material (pág. ${c.page}): ${c.term} — ${short}`,fuente:c.def,pagina:c.page,origen:"algoritmo"});
      qs.push({tema:temaOf(c),dificultad:2,tipo:"identificacion",concepto:c.term,
        pregunta:`¿Cuál de las siguientes opciones describe mejor: ${c.term}?`,
        correcta:short,incorrectas:d.map(o=>firstSentences(o.def)),
        explicacion:`El material (pág. ${c.page}) lo describe así: ${short}`,fuente:c.def,pagina:c.page,origen:"algoritmo"});
    }

    for(const c of shuffle(defs).slice(0,Math.ceil(defs.length*.35))){
      const o=pickTerms(c,defs,1)[0]; if(!o) continue;
      const truthy=Math.random()<.5, d=firstSentences(truthy?c.def:o.def,150);
      qs.push({tema:temaOf(c),dificultad:truthy?1:2,tipo:"verdadero_falso",concepto:c.term,
        pregunta:`Verdadero o falso: según el material, "${c.term}" se describe así: «${mask(d,c.term)}»`,
        correcta:truthy?"Verdadero":"Falso",incorrectas:[truthy?"Falso":"Verdadero"],
        explicacion: truthy?`Es verdadero. Así lo describe el material (pág. ${c.page}).`:`Es falso. Esa descripción corresponde a "${o.term}". ${c.term}: ${firstSentences(c.def,150)}`,
        fuente:c.def,pagina:c.page,origen:"algoritmo"});
    }
    for(const c of sig){
      const others=shuffle(sig.filter(o=>o.term!==c.term)).slice(0,3).map(o=>o.def);
      const extra=shuffle(defs).map(o=>o.term).filter(t=>t.split(" ").length>=3);

      if(others.length<3) continue;
      qs.push({tema:temaOf(c),dificultad:1,tipo:"definicion",concepto:"Siglas: "+c.term,
        pregunta:`¿Qué significa ${c.term}?`,correcta:c.def,incorrectas:others,
        explicacion:`Según el material (pág. ${c.page}), ${c.term} significa ${c.def}.`,fuente:c.def,pagina:c.page,origen:"algoritmo"});
    }
    for(const L of lists){
      if(L.items.length<3) continue;
      const notIn=x=>!L.items.some(i=>norm(i)===norm(x)); const sameDoc=shuffle([...lists.filter(o=>o!==L&&o.doc===L.doc).flatMap(o=>o.items),...defs.filter(d=>d.doc===L.doc).map(d=>d.term)]).filter(notIn); const otherDoc=shuffle([...lists.filter(o=>o.doc!==L.doc).flatMap(o=>o.items),...defs.filter(d=>d.doc!==L.doc).map(d=>d.term)]).filter(notIn); const foreign=[...sameDoc,...otherDoc];
      if(foreign.length<3) continue;
      const items=shuffle(L.items);
      qs.push({tema:temaOf(L),dificultad:2,tipo:"cual_no",concepto:L.term,
        pregunta:`¿Cuál de los siguientes NO aparece en "${L.term}" según el material?`,
        correcta:foreign[0],incorrectas:items.slice(0,3),
        explicacion:`En "${L.term}" el material (pág. ${L.page}) incluye: ${L.items.join("; ")}.`,fuente:L.items.join(" "),pagina:L.page,origen:"algoritmo"});
      qs.push({tema:temaOf(L),dificultad:1,tipo:"identificacion",concepto:L.term,
        pregunta:`¿Cuál de los siguientes forma parte de "${L.term}" según el material?`,
        correcta:items[0],incorrectas:foreign.slice(1,4),
        explicacion:`En "${L.term}" el material (pág. ${L.page}) incluye: ${L.items.join("; ")}.`,fuente:L.items.join(" "),pagina:L.page,origen:"algoritmo"});
    }

  }
  return {linesOf,blocksOf,cards,questions,norm};
})();

    tipo:TIPOS.includes(tipo)?tipo:"identificacion",concepto:String(pick(r,"concepto","concept","tema")||"").trim().slice(0,80),
    pregunta,correcta,incorrectas,explicacion:String(pick(r,"explicacion","explicación","explanation","justificacion","retroalimentacion")||"").trim(),
    fuente:String(pick(r,"fuente","cita","source","quote")||"").trim(),pagina:isNaN(pg)?null:pg,verif:null,origen:"ia"}};
}
/* Devuelve {materia, temas, preguntas, descartadas:[{n,motivo}], bloques} */
function parseBank(text){
  const res={materia:"",temas:[],preguntas:[],descartadas:[],bloques:0};
  const chunks=findJsonChunks(text);
  const objs=[];
  for(const c of chunks){ const v=tryParse(c); if(v!==undefined){objs.push(v);res.bloques++;} }
  if(!objs.length){ const v=tryParse(text.trim()); if(v!==undefined) objs.push(v); }
  let n=0;
  const takeArr=(arr,temaDef)=>arr.forEach(r=>{n++;const x=normalizeQ(r,temaDef); if(x.q)res.preguntas.push(x.q); else res.descartadas.push({n,motivo:x.err});});
  for(const o of objs){
    if(Array.isArray(o)){ if(o.length&&typeof o[0]==="object") takeArr(o); continue; }
    if(typeof o!=="object") continue;
    res.materia=res.materia||String(pick(o,"materia","asignatura","titulo","title","subject")||"");
    const temas=pick(o,"temas","topics","unidades");
    if(Array.isArray(temas)) temas.forEach(t=>{const s=typeof t==="object"?String(pick(t,"nombre","name","titulo")||""):String(t); if(s&&!res.temas.includes(s))res.temas.push(s);});
    const arr=pick(o,"preguntas","questions","reactivos","banco");
    if(Array.isArray(arr)) takeArr(arr);
    else if(o.pregunta||o.question){ takeArr([o]); }
  }
  // evitar duplicados exactos
  const seen=new Set(); res.preguntas=res.preguntas.filter(q=>{const k=normTxt(q.pregunta)+"|"+normTxt(q.correcta); if(seen.has(k))return false; seen.add(k); return true;});
  res.preguntas.forEach(q=>{ if(!res.temas.includes(q.tema)) res.temas.push(q.tema); });
  return res;
}

/* ---------- verificación de la fuente contra el texto del PDF ---------- */
function verify(qs,docs){
  if(!docs||!docs.length) return;
  const corpus=" "+normTxt(docs.map(d=>d.text).join(" "))+" ";
  for(const q of qs){
    if(q.origen==="algoritmo"){q.verif="ok";continue;}
    const f=normTxt(q.fuente);
    if(!f||f.split(" ").length<4){ q.verif="sinfuente"; continue; }
    if(corpus.includes(" "+f+" ")||corpus.includes(f)){ q.verif="ok"; continue; }
    const w=f.split(" "); let hit=0,tot=0;
    for(let i=0;i+4<=w.length;i+=2){ tot++; if(corpus.includes(w.slice(i,i+4).join(" "))) hit++; }
    q.verif = tot&&hit/tot>=.7 ? "ok" : "no";
  }
}

  return `INSTRUCCIONES PARA CREAR UN BANCO DE PREGUNTAS
Archivo generado por el Simulador de Examen. Léelo completo antes de empezar.

== TU TAREA ==
Actúa como profesor universitario que prepara un examen de práctica.
Con base ÚNICAMENTE en los archivos PDF de estudio que te adjunté en esta conversación, crea ${N} preguntas de opción múltiple${batch?" (este es un lote; habrá más)":""} para la materia:
   ${cfg.materia||"(usa el nombre de la materia que aparezca en los PDF)"}

== TEMAS ==
${temasTxt}
Reparte las preguntas entre los temas de forma proporcional a la cantidad de contenido de cada uno.

== CONCEPTOS QUE EL ESTUDIANTE QUIERE PRIORIZAR ==
${prio}

== REGLAS DE CONTENIDO (OBLIGATORIAS) ==
1. Usa SOLO información que aparezca en los PDF. No agregues conceptos, definiciones, leyes, cifras, ejemplos reales ni datos de otras fuentes.
2. Si el PDF contradice lo que tú sabes, usa lo que dice el PDF. No lo corrijas.
3. Lee también el texto que está dentro de imágenes, diagramas y tablas.
4. Cada pregunta debe tener UNA sola respuesta correcta, sin ambigüedad.
5. Escribe 3 respuestas incorrectas creíbles: del mismo tema, con longitud y estilo parecidos a la correcta. La correcta NO debe ser siempre la más larga.
6. Prohibido usar "Todas las anteriores", "Ninguna de las anteriores", "A y B" o similares.

`;

const PROVIDERS={
  gemini:{name:"Google Gemini",model:"gemini-flash-latest",models:["gemini-flash-latest","gemini-flash-lite-latest","gemini-2.5-flash"],keyUrl:"https://aistudio.google.com/apikey",pdf:true},
  openrouter:{name:"OpenRouter",model:"meta-llama/llama-3.3-70b-instruct:free",keyUrl:"https://openrouter.ai/keys",pdf:false},
  custom:{name:"Otra (compatible con OpenAI)",model:"",keyUrl:"",pdf:false}
};
class ApiError extends Error{constructor(kind,msg){super(msg);this.kind=kind;}}
async function callAI(cfg,prompt,docs){
  const p=cfg.provider;
  let res;
  try{
    if(p==="gemini"){
      const parts=[];
      if(cfg.sendPdf){ for(const d of docs) parts.push({inline_data:{mime_type:"application/pdf",data:d.b64}}); }
      else parts.push({text:"MATERIAL DE ESTUDIO (texto extraído de los PDF):\n"+docs.map(d=>`\n===== PDF: ${d.name} =====\n${d.text}`).join("\n")});
      parts.push({text:prompt});
      res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`,{method:"POST",
        headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},
        body:JSON.stringify({contents:[{role:"user",parts}],generationConfig:{temperature:.4,responseMimeType:"application/json"}})});
    }else{
      const base=p==="openrouter"?"https://openrouter.ai/api/v1":cfg.baseUrl.replace(/\/+$/,"");
      const headers={"Content-Type":"application/json"}; if(cfg.key) headers.Authorization="Bearer "+cfg.key;
      if(p==="openrouter"){headers["X-Title"]="Simulador de Examen";}
      const material=docs.map(d=>`\n===== PDF: ${d.name} =====\n${d.text}`).join("\n");
      res=await fetch(base+"/chat/completions",{method:"POST",headers,body:JSON.stringify({model:cfg.model,temperature:.4,
        messages:[{role:"system",content:"Eres un profesor universitario que crea exámenes de práctica. Respondes solo con JSON válido."},
                  {role:"user",content:"MATERIAL DE ESTUDIO (texto extraído de los PDF):\n"+material+"\n\n"+prompt}]})});
    }
  }catch(e){ throw new ApiError("net","No se pudo conectar con "+PROVIDERS[p].name+". Puede ser falta de internet o que el servicio no permita conexiones desde esta página."); }
  let body=null; const raw=await res.text(); try{body=JSON.parse(raw);}catch(e){}
  if(!res.ok){
    const msg=body?.error?.message||body?.message||raw.slice(0,200);
    if(res.status===400&&/api key|API_KEY/i.test(msg)||res.status===401||res.status===403) throw new ApiError("key","La clave no es válida o no tiene permiso. Revisa que la copiaste completa. Detalle: "+msg);
    if(res.status===429) throw new ApiError("limit","Llegaste al límite gratuito de "+PROVIDERS[p].name+" por ahora. Espera un rato o intenta mañana. Detalle: "+msg);
    if(res.status===404) throw new ApiError("model","El modelo «"+cfg.model+"» no existe o ya no está disponible. Prueba con otro. Detalle: "+msg);
    if(res.status===413||/too large|token/i.test(msg)) throw new ApiError("size","El material es demasiado grande para este servicio. Prueba con menos PDFs o con Gemini. Detalle: "+msg);
    throw new ApiError("other",`Error ${res.status}: ${msg}`);
  }
  const out = p==="gemini" ? (body?.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("") : (body?.choices?.[0]?.message?.content||"");
  if(!out) throw new ApiError("empty","El servicio respondió vacío. Intenta de nuevo.");
  return out;
}

async function testKey(){
  readSet(); const p=SET.provider,key=SET.keys[p],P=PROVIDERS[p];
  const put=t=>{SET.test[p]=t;const el=$("#s-test");if(el)el.innerHTML=testHtml(t);};
  if(p!=="custom"&&!key) return put({status:"bad",msg:"Pega tu clave primero."});
  put({status:"busy"});
  let r,j=null;
  try{
    if(p==="gemini") r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000",{headers:{"x-goog-api-key":key}});
    else if(p==="openrouter") r=await fetch("https://openrouter.ai/api/v1/key",{headers:{Authorization:"Bearer "+key}});
    else r=await fetch(SET.baseUrl.replace(/\/+$/,"")+"/models",{headers:key?{Authorization:"Bearer "+key}:{}});
    try{j=await r.json();}catch(e){}
  }catch(e){
    return put({status:"bad",msg:EMBEDDED?`<b>No se pudo probar.</b> ${EMBED_MSG}`:`<b>No se pudo conectar con ${esc(P.name)}.</b> Revisa tu conexión a internet. Si el problema sigue, puede que el servicio no permita conexiones desde una página; en ese caso usa la opción 2.`});
  }
  if(!r.ok){
    const m=j?.error?.message||j?.message||("Error "+r.status);
    if([400,401,403].includes(r.status)) return put({status:"bad",msg:`<b>✗ La clave no funciona.</b> Revisa que la copiaste completa, sin espacios. Detalle: ${esc(m)}`});
    if(r.status===429) return put({status:"warn",msg:`<b>La clave es válida, pero llegaste al límite de uso por ahora.</b> Intenta más tarde.`});
    return put({status:"bad",msg:`<b>✗ No se pudo verificar.</b> ${esc(m)}`});
  }
  let models=[],extra="";
  if(p==="gemini"){
    models=(j?.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""))
      .filter(n=>/gemini/.test(n)&&!/embedding|tts|image|live|audio/.test(n)).sort((a,b)=>(/flash/.test(b)-/flash/.test(a))||a.localeCompare(b));
    extra=` ${models.length} modelos disponibles.`;
  }else if(p==="openrouter"){
    const d=j?.data||{}; extra=d.is_free_tier?" Cuenta gratuita: usa modelos que terminan en «:free».":"";
    try{const mr=await fetch("https://openrouter.ai/api/v1/models");const mj=await mr.json();models=(mj.data||[]).map(x=>x.id).filter(id=>/:free$/.test(id)).sort();extra+=` ${models.length} modelos gratuitos disponibles.`;}catch(e){}
  }else{ models=(j?.data||[]).map(x=>x.id).filter(Boolean); if(models.length) extra=` ${models.length} modelos disponibles.`; }
  SET.modelList[p]=models;
  const cur=($("#s-model")?.value||"").trim();
  let warn="";
  if(models.length&&cur&&!models.includes(cur)&&!(p==="gemini"&&/-latest$/.test(cur))){ warn=` <br>El modelo «${esc(cur)}» no aparece en la lista; elige uno de la lista del campo Modelo.`; }
  S.ai.verified[p]={ok:true,ts:Date.now()};
  readSet(); render();
  put({status:warn?"warn":"ok",msg:`<b>✓ La clave funciona.</b>${esc(extra)}${warn}`});
}
function saveSettings(){
  readSet(); const a=S.ai;
  a.provider=SET.provider; a.models={...SET.models}; a.baseUrl=SET.baseUrl; a.remember=SET.remember; a.sendPdf=SET.sendPdf;
  for(const [p,k] of Object.entries(SET.keys)){ if(SET.remember){ if(k) a.keys[p]=k; else delete a.keys[p]; delete SESSION_KEYS[p]; } else { delete a.keys[p]; if(k) SESSION_KEYS[p]=k; } }
  save(); toast("Configuración guardada");
  const back=CREATE.backTo; CREATE.backTo=null; SET=null;
  go(back||"settings");
}

/* ---------- motor de examen ---------- */
function inst(q){
  const tf=q.tipo==="verdadero_falso"||(/^(Verdadero|Falso)$/.test(q.correcta)&&q.incorrectas.length===1);
  const opts=tf?["Verdadero","Falso"]:shuffle([q.correcta,...q.incorrectas]);
  return {id:q.id,opts,ci:opts.indexOf(q.correcta),pick:null};
}
function poolOf(b){const sel=b.sel&&b.sel.length?b.sel:b.temas;return b.preguntas.filter(q=>!q.dudosa&&sel.includes(q.tema));}
function pickQs(b,n){
  const pool=poolOf(b); n=Math.min(n,pool.length);
  const recent=new Set(b.stats.recent);
  const order=a=>{const s=shuffle(a);return [...s.filter(q=>!recent.has(q.id)),...s.filter(q=>recent.has(q.id))]};
  const want={1:Math.round(n*.3),3:Math.round(n*.25)}; want[2]=n-want[1]-want[3];
  const out=[],used=new Set();
  for(const k of [1,2,3]) for(const q of order(pool.filter(q=>q.dificultad===k))){ if(want[k]<=0)break; out.push(q);used.add(q.id);want[k]--; }
  for(const q of order(pool)){ if(out.length>=n)break; if(!used.has(q.id)){out.push(q);used.add(q.id);} }
  return shuffle(out);

function startReview(ids){

function record(it){
  const b=curBank(),q=qById(b,it.id); if(!q) return; const ok=it.pick===it.ci;

  }catch(e){
    CREATE.busy=false;
    const tip=e.kind==="net"&&EMBEDDED?`<br><br>${EMBED_MSG}`:e.kind==="net"?`<br><br><b>Qué hacer:</b> usa la <button class="link" type="button" data-go="c-copy">opción 2 (copiar y pegar)</button>; funciona con la misma IA sin conexión directa.`:"";
    if(all.length){ prog(`<p class="note w">${esc(e.message)}<br>Se generaron ${all.length} preguntas antes del error; puedes revisarlas.</p>`); }
    else { render(); prog(`<p class="note b">${esc(e.message)}${tip}</p>`); return; }
    toast(e.message);
  }
  CREATE.busy=false;
  if(!all.length){ render(); return; }
  verify(all,docs);
  all.forEach(q=>q.origen="ia");
  DRAFT={materia:c.materia||meta.materia,temas:meta.temas.length?meta.temas:[...new Set(all.map(q=>q.tema))],preguntas:all.slice(0,total),descartadas:[]};
  CREATE.progHtml=""; FILTER="all"; go("review");
}
function runAlgo(){
  const docs=docsCache.algo||[]; const c=CREATE.cfg4; c.materia=($("#c4-materia")?.value||"").trim();
  const cs=ALGO.cards(docs.map(d=>({name:d.name,pages:d.pages})));
  const qs=ALGO.questions(cs).map(q=>({...q,id:uid(),verif:"ok"}));
  if(!qs.length){
    const low=docs.some(d=>d.lowText);
    CREATE.algoMsg=low?"No encontré texto suficiente. Tus PDF parecen escaneados o hechos de imágenes; este método no puede leerlos. Usa la opción 2 o 3.":"No encontré títulos con su definición en estos PDF. Usa la opción 2: la IA sí puede entender este material.";
    render(); return;
  }
  DRAFT={materia:c.materia||docs[0].name,temas:docs.map(d=>d.name),preguntas:qs,descartadas:[],algo:{cards:cs.length,docs:docs.length}};
  CREATE.algoMsg=""; FILTER="all"; go("review");
}
function saveDraft(){
  const d=DRAFT; const keep=d.preguntas.filter(q=>!q._off).map(q=>{const {_off,...r}=q;return r;});
  if(d.bankId&&S.banks[d.bankId]){
    const b=S.banks[d.bankId];
    const offIds=new Set(d.preguntas.filter(q=>q._off).map(q=>q.id));
    b.preguntas=d.preguntas.map(q=>{const {_off,...r}=q; return {...r,dudosa:offIds.has(q.id)};});
    b.temas=[...new Set([...b.temas,...b.preguntas.map(q=>q.tema)])].filter(t=>b.preguntas.some(q=>q.tema===t));
    if(save()){ BANK=b.id; DRAFT=null; toast("Cambios guardados"); go("bank"); }
    return;
  }
  const materia=($("#r-materia")?.value||d.materia||"Mi banco").trim(), target=$("#r-target")?.value;
  let b;
  if(target&&S.banks[target]){
    b=S.banks[target]; const seen=new Set(b.preguntas.map(q=>normTxt(q.pregunta)));
    keep.forEach(q=>{ if(!seen.has(normTxt(q.pregunta))) b.preguntas.push(q); });
  }else{
    const id=uid(); const temas=[...new Set([...d.temas,...keep.map(q=>q.tema)])].filter(t=>keep.some(q=>q.tema===t));
    b={id,materia,temas,preguntas:keep,creado:Date.now(),stats:newStats(temas),sel:[]};
    S.banks[id]=b; S.order.unshift(id);
  }
  b.temas=[...new Set([...b.temas,...b.preguntas.map(q=>q.tema)])];
  b.temas.forEach(t=>{ b.stats.tema[t]=b.stats.tema[t]||{c:0,t:0}; });
  if(save()){ BANK=b.id; DRAFT=null; toast("Banco guardado"); go("bank"); }
}
function exportBank(b){
  const data={formato:FORMAT,materia:b.materia,temas:b.temas,preguntas:b.preguntas.filter(q=>!q.dudosa).map(q=>({tema:q.tema,dificultad:["","facil","intermedia","dificil"][q.dificultad],tipo:q.tipo,concepto:q.concepto,pregunta:q.pregunta,correcta:q.correcta,incorrectas:q.incorrectas,explicacion:q.explicacion,fuente:q.fuente,pagina:q.pagina}))};
  download(`banco-${slug(b.materia)}.json`,JSON.stringify(data,null,1));
}

/* =========================================================
   RENDER Y EVENTOS
   ========================================================= */
function render(){
  const v={home:vHome,"c-import":vImport,"c-copy":vCopy,"c-key":vKey,"c-algo":vAlgo,create:()=>`<section class="hero"><div class="eyebrow">Crear banco</div><h1 style="font-size:38px">¿Cómo quieres conseguir tus preguntas?</h1><p>Todas las opciones terminan en el mismo lugar: revisas las preguntas, las guardas y empiezas a estudiar.</p></section>${waysHtml()}`,
    settings:vSettings,review:vReview,bank:vBank,quiz:vQuiz,results:vResults,errors:vErrors,stats:vStats,help:vHelp}[VIEW]||vHome;
  $("#app").innerHTML=v();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===VIEW||(b.dataset.go==="create"&&VIEW.startsWith("c-"))||(b.dataset.go==="home"&&["bank","errors","stats"].includes(VIEW))));
}
function syncForms(){ // guarda lo escrito antes de re-renderizar
  if(VIEW==="c-copy"&&CREATE.cfg2&&$("#c2-materia")) readCfg("c2",CREATE.cfg2);
  if(VIEW==="c-key"&&CREATE.cfg3&&$("#c3-materia")) readCfg("c3",CREATE.cfg3);
  if(VIEW==="settings") readSet();
  if(VIEW==="c-algo"&&CREATE.cfg4&&$("#c4-materia")) CREATE.cfg4.materia=$("#c4-materia").value;
  const pt=document.querySelector("textarea[id$='-paste']"); if(pt){CREATE.pasteText=pt.value;CREATE.pasteOpen=pt.closest("details").open;}
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-go]"); if(!t) return;
  if(t.tagName==="LABEL") return;
  const d=t.dataset;
  if(d.go){ e.preventDefault(); syncForms(); return go(d.go); }
  if(d.open){ BANK=d.open; return go("bank"); }
  if(d.exam) return startExam(+d.exam);
  if(d.opt!==undefined) return choose(+d.opt);
  if(d.rev) return startReview(d.rev.split(","));
  if(d.filter){ FILTER=d.filter; return render(); }
  if(d.edit){ EDIT=d.edit; return render(); }
  if(d.toggle){ const q=DRAFT.preguntas.find(x=>x.id===d.toggle); q._off=!q._off; return render(); }
  if(d.rmdoc){ const [k,i]=d.rmdoc.split(":"); syncForms(); docsCache[k].splice(+i,1); e.preventDefault(); return render(); }
  const b=curBank();
  switch(d.act){
    case "practice": return startPractice();
    case "review-errors": return startReview();
    case "next": return next();
    case "quit": return SES.mode==="exam"?askQuit("bank"):askQuit("results",true);
    case "again": return SES.mode==="exam"?startExam(SES.n):SES.mode==="review"?startReview():startPractice();
    case "flag": { const q=qById(b,SES.items[SES.i].id); q.dudosa=true; save(); toast("Marcada como dudosa. Ya no aparecerá; puedes restaurarla en «Editar preguntas»."); t.remove(); return; }
    case "b-export": return exportBank(b);
    case "b-edit": DRAFT={bankId:b.id,materia:b.materia,temas:b.temas,preguntas:b.preguntas.map(q=>({...q,_off:!!q.dudosa}))}; FILTER="all"; return go("review");
    case "b-del": $("#b-confirm").innerHTML=`<div class="card stack" style="border-color:var(--bad)"><b>¿Eliminar «${esc(b.materia)}»? Se borran sus preguntas, errores y estadísticas de este navegador.</b><div class="row"><button class="btn danger" type="button" data-act="b-del-yes">Sí, eliminar</button><button class="btn" type="button" data-act="b-del-no">Cancelar</button></div></div>`; return;
    case "b-del-yes": delete S.banks[b.id]; S.order=S.order.filter(x=>x!==b.id); BANK=null; save(); toast("Banco eliminado"); return go("home");
    case "b-del-no": $("#b-confirm").innerHTML=""; return;
    case "s-reset": $("#s-reset").innerHTML=`<span>¿Seguro? Se borran exámenes, porcentajes y errores de este banco.</span><button class="btn danger" type="button" data-act="s-reset-yes">Sí, borrar</button><button class="btn ghost" type="button" data-go="stats">Cancelar</button>`; return;
    case "s-reset-yes": b.stats=newStats(b.temas); save(); return render();
    case "imp-parse": case "c2-parse": { syncForms(); const id=d.act.split("-")[0]; return importText($("#"+id+"-paste").value,id); }
    case "c2-dl": readCfg("c2",CREATE.cfg2); return download(`instrucciones-${slug(CREATE.cfg2.materia||"banco")}.txt`,buildPrompt(CREATE.cfg2),"text/plain");
    case "c2-copy": readCfg("c2",CREATE.cfg2); return copy(buildPrompt(CREATE.cfg2));
    case "c2-copymsg": return copy("Te adjunto mis PDF de estudio y un archivo de instrucciones. Sigue las instrucciones del archivo al pie de la letra.");
    case "k-run": return runKey();
    case "k-stop": ABORT=true; toast("Se detendrá al terminar el lote actual."); return;
    case "to-settings": syncForms(); CREATE.backTo="c-key"; SET=null; return go("settings");
    case "s-test": return testKey();
    case "s-save": return saveSettings();
    case "s-forget": { const p=SET.provider; delete S.ai.keys[p]; delete SESSION_KEYS[p]; delete S.ai.verified[p]; SET.keys[p]=""; SET.test[p]=null; save(); toast("Clave borrada"); return render(); }
    case "a-run": return runAlgo();
    case "r-offno": DRAFT.preguntas.forEach(q=>{if(q.verif==="no")q._off=true;}); return render();
    case "r-save": return saveDraft();
    case "r-cancel": { const back=DRAFT?.bankId?"bank":"create"; DRAFT=null; return go(back); }
    case "e-cancel": EDIT=null; return render();
    case "e-save": { const q=DRAFT.preguntas.find(x=>x.id===EDIT);
      const inc=[0,1,2].map(i=>$("#e-inc"+i).value.trim()).filter(Boolean);
      const corr=$("#e-corr").value.trim(), preg=$("#e-preg").value.trim();
      if(!preg||!corr||(!/^(Verdadero|Falso)$/.test(corr)&&inc.length<2)){ toast("La pregunta necesita texto, respuesta correcta y al menos 2 incorrectas."); return; }
      Object.assign(q,{pregunta:preg,correcta:corr,incorrectas:inc,explicacion:$("#e-exp").value.trim(),tema:$("#e-tema").value.trim()||q.tema,dificultad:+$("#e-dif").value});
      if(!DRAFT.temas.includes(q.tema)) DRAFT.temas.push(q.tema);
      EDIT=null; return render(); }
  }
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="t-all"||el.dataset.tema!==undefined){
    const b=curBank(); let sel=b.sel&&b.sel.length?[...b.sel]:[...b.temas];
    if(el.id==="t-all") sel=el.checked?[...b.temas]:[];
    else { const t=b.temas[+el.dataset.tema]; sel=el.checked?[...new Set([...sel,t])]:sel.filter(x=>x!==t); }
    b.sel=sel.length?sel:["__ninguno__"]; save(); render(); return;
  }
  if(el.id==="s-provider"){ readSet(); SET.provider=el.value; render(); return; }
  if(el.id==="s-key"&&SET){ SET.test[SET.provider]=null; delete S.ai.verified[SET.provider]; }
  if(el.type==="file"){
    const id=el.id.replace(/-input$|-file$/,"");
    syncForms();
    if(el.id.endsWith("-file")) await importFiles([...el.files],id);
    else await addPdfs(id,el.files);
    el.value="";
  }
  if(["c2-materia","c2-n","c2-temas","c2-prio"].includes(el.id)){ readCfg("c2",CREATE.cfg2); const p=$("#c2-preview"); if(p) p.textContent=buildPrompt(CREATE.cfg2); }
});
// arrastrar y soltar
document.addEventListener("dragover",e=>{const d=e.target.closest(".drop");if(d){e.preventDefault();d.classList.add("over");}});
document.addEventListener("dragleave",e=>{const d=e.target.closest(".drop");if(d)d.classList.remove("over");});
document.addEventListener("drop",async e=>{
  const d=e.target.closest(".drop"); if(!d) return; e.preventDefault(); d.classList.remove("over");
  const input=d.querySelector("input[type=file]"); const files=[...e.dataTransfer.files]; syncForms();
  if(input.id.endsWith("-file")) await importFiles(files,input.id.replace(/-file$/,""));
  else await addPdfs(input.id.replace(/-input$/,""),files);
});
document.addEventListener("keydown",e=>{
  if(VIEW!=="quiz"||!SES||e.target.closest("input,textarea,select")) return;
  const idx=L.indexOf(e.key.toUpperCase()); const it=SES.items[SES.i];
  if(idx>=0&&idx<it.opts.length){e.preventDefault();choose(idx);}
  else if(e.key==="Enter"&&SES.answered){e.preventDefault();next();}
});
render();
</script>
</body>
